# Global image registry configuration
global:
  imageRegistry: "cr-demo-cn-shanghai.cr.volces.com"
  namespace: "cvat"
  storageClass: "ebs-ssd"
  # Configure image pull secrets for private registry
  imagePullSecrets:
    - name: "volc-registry-secret"

# Ingress configuration
ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  hosts:
    - host: cvat.poc.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: cvat-tls-secret
      hosts:
        - cvat.poc.example.com

imagePullSecrets:
  - name: "volc-registry-secret"

# Storage configuration
cvat:
  backend:
    image: "cr-demo-cn-shanghai.cr.volces.com/cvat/cvat-server"
    tag: "v2.31.0"
    resources:
      requests:
        cpu: "250m"
        memory: "800Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
    defaultStorage:
      enabled: true
      storageClassName: "ebs-ssd"
      accessModes:
        - ReadWriteOnce
      size: 20Gi
      annotations: {}
    permissionFix:
      enabled: true
    envs:
      ALLOWED_HOSTS: "cvat.poc.example.com"
      CSRF_TRUSTED_ORIGINS: "http://cvat.poc.example.com,https://cvat.poc.example.com"

    initializer:
      image: "cr-demo-cn-shanghai.cr.volces.com/cvat/busybox"
      tag: "latest"

    server:
      replicas: 1
      resources:
        requests:
          cpu: "100m"
          memory: "200Mi"
        limits:
          cpu: "300m"
          memory: "500Mi"
      defaultStorage:
        enabled: true
        size: 20Gi
        storageClass: "ebs-ssd"
        accessModes:
          - ReadWriteOnce
        annotations: {}

      # Worker configurations
    worker:
      chunks:
        replicas: 1
        resources:
          requests:
            cpu: "100m"
            memory: "200Mi"
          limits:
            cpu: "300m"
            memory: "500Mi"
        persistence:
          enabled: true
          size: 20Gi
          storageClass: "ebs-ssd"
          accessModes:
            - ReadWriteOnce
          annotations: {}
      track:
        replicas: 1
        resources:
          requests:
            cpu: "100m"
            memory: "200Mi"
          limits:
            cpu: "300m"
            memory: "500Mi"
      consensus:
        replicas: 1
        resources:
          requests:
            cpu: "100m"
            memory: "200Mi"
          limits:
            cpu: "300m"
            memory: "500Mi"
      export:
        replicas: 1
        resources:
          requests:
            cpu: "100m"
            memory: "200Mi"
          limits:
            cpu: "300m"
            memory: "500Mi"
      import:
        replicas: 1
        resources:
          requests:
            cpu: "100m"
            memory: "200Mi"
          limits:
            cpu: "300m"
            memory: "500Mi"

  frontend:
    image: "cr-demo-cn-shanghai.cr.volces.com/cvat/cvat-ui"
    tag: v2.31.0
    resources:
      requests:
        cpu: "100m"
        memory: "200Mi"
      limits:
        cpu: "300m"
        memory: "500Mi"

  opa:
    image: "cr-demo-cn-shanghai.cr.volces.com/cvat/opa"
    tag: 0.63.0

  kvrocks:
    image: "cr-demo-cn-shanghai.cr.volces.com/cvat/kvrocks"
    tag: 2.7.0
    defaultStorage:
      storageClassName: "ebs-ssd"
      size: 20Gi
      accessModes:
        - ReadWriteOnce
      annotations: {}
    resources:
      requests:
        cpu: "100m"
        memory: "200Mi"
      limits:
        cpu: "300m"
        memory: "500Mi"


# PostgreSQL configuration
postgresql:
  enabled: true
  secret:
    password: cvat_postgresql
    postgres_password: cvat_postgresql_postgres
    replication_password: cvat_postgresql_replica

  image:
    registry: "cr-demo-cn-shanghai.cr.volces.com"
    repository: "cvat/postgresql"
    tag: "15.2.0-debian-11-r0"
  primary:
    persistence:
      enabled: true
      storageClass: "ebs-ssd"
      size: 20Gi
      accessModes:
        - ReadWriteOnce
      annotations: {}
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

# Redis configuration
redis:
  enabled: true
  architecture: standalone
  image:
    registry: "cr-demo-cn-shanghai.cr.volces.com"
    repository: "cvat/redis"
    tag: "7.2.3-debian-11-r1"
  master:
    persistence:
      enabled: true
      storageClass: "ebs-ssd"
      size: 20Gi
      accessModes:
        - ReadWriteOnce
      annotations: {}
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
  auth:
    enabled: true
    password: "cvat_redis"


# Disable optional components
nuclio:
  enabled: false

traefik:
  enabled: false
  image:
    registry: cr-demo-cn-shanghai.cr.volces.com
    repository: cvat/traefik
    tag: v2.10

analytics:
  # Set clickhouse.enabled to false if you disable analytics or use an external database
  enabled: false

# Other component configurations
vector:
  image:
    repository: cr-demo-cn-shanghai.cr.volces.com/cvat/vector
    tag: "0.26.0-alpine"

clickhouse:
  image:
    repository: cr-demo-cn-shanghai.cr.volces.com/cvat/clickhouse
    tag: "23.12.2-debian-11-r0"
  auth:
    enabled: true
    username: "cvat"
    password: "cvat_clickhouse"
  initdbScripts:
    init.sql: |
      CREATE DATABASE IF NOT EXISTS cvat;
      CREATE USER IF NOT EXISTS cvat IDENTIFIED WITH sha256_password BY 'cvat_clickhouse';
      GRANT ALL ON cvat.* TO cvat;
  initdbSecret: "cvat-clickhouse-init"

  # 添加Secret定义
  existingSecret: "cvat-clickhouse-init"
  secret:
    enabled: true
    password: "cvat_clickhouse"
    initdbScripts:
      init.sql: |
        CREATE DATABASE IF NOT EXISTS cvat;
        CREATE USER IF NOT EXISTS cvat IDENTIFIED WITH sha256_password BY 'cvat_clickhouse';
        GRANT ALL ON cvat.* TO cvat;
  persistence:
    storageClass: "ebs-ssd"
    size: 20Gi
    accessModes:
      - ReadWriteOnce
    annotations: {}


grafana:
  image: "cr-demo-cn-shanghai.cr.volces.com/cvat/grafana:10.1.5"


bats:
  image: "cr-demo-cn-shanghai.cr.volces.com/cvat/bats:v1.4.1"
