# Global image registry configuration
global:
  image:
    registry: "cr-demo-cn-shanghai.cr.volces.com"
    namespace: "cvat"
  # Configure image pull secrets for private registry
  imagePullSecrets:
    - name: "volc-registry-secret"

# PostgreSQL configuration
postgresql:
  enabled: true
  image:
    registry: "cr-demo-cn-shanghai.cr.volces.com"
    repository: "cvat/postgresql"
    tag: "15.2.0-debian-11-r0"
  persistence:
    storageClass: "ebs-ssd"
    size: 10Gi
    accessModes:
      - ReadWriteOnce
    annotations: {}
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  secret:
    password: "cvat_postgresql"
    postgres_password: "cvat_postgresql_postgres"
    replication_password: "cvat_postgresql_replica"


# Ingress configuration
ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  hosts:
    - host: cvat.poc.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: cvat-tls-secret
      hosts:
        - cvat.poc.example.com

# Storage configuration
cvat:
  backend:
    image:
      repository: "cr-demo-cn-shanghai.cr.volces.com/cvat/cvat-server"
      tag: "v2.31.0"
    resources:
      requests:
        cpu: "250m"
        memory: "800Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
    persistence:
      enabled: true
      size: 10Gi
      storageClass: "ebs-ssd"
      accessModes:
        - ReadWriteOnce
      annotations: {}
    envs:
      ALLOWED_HOSTS: "cvat.poc.example.com"
      CSRF_TRUSTED_ORIGINS: "http://cvat.poc.example.com,https://cvat.poc.example.com"

  ui:
    image:
      repository: "cr-demo-cn-shanghai.cr.volces.com/cvat/cvat-ui"
      tag: "v2.31.0"
    resources:
      requests:
        cpu: "100m"
        memory: "200Mi"
      limits:
        cpu: "300m"
        memory: "500Mi"

  # Worker configurations
  worker:
    chunks:
      replicas: 1
      resources:
        requests:
          cpu: "100m"
          memory: "200Mi"
        limits:
          cpu: "300m"
          memory: "500Mi"
    consensus:
      replicas: 1
      resources:
        requests:
          cpu: "100m"
          memory: "200Mi"
        limits:
          cpu: "300m"
          memory: "500Mi"
    export:
      replicas: 1
      resources:
        requests:
          cpu: "100m"
          memory: "200Mi"
        limits:
          cpu: "300m"
          memory: "500Mi"
    import:
      replicas: 1
      resources:
        requests:
          cpu: "100m"
          memory: "200Mi"
        limits:
          cpu: "300m"
          memory: "500Mi"

# Redis configuration
redis:
  enabled: true
  architecture: standalone
  image:
    registry: "cr-demo-cn-shanghai.cr.volces.com"
    repository: "cvat/redis"
    tag: "7.2.3-debian-11-r1"
  persistence:
    storageClass: "ebs-ssd"
    size: 5Gi
    accessModes:
      - ReadWriteOnce
    annotations: {}
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
  auth:
    enabled: true
    password: "cvat_redis"


# Disable optional components
nuclio:
  enabled: false

analytics:
  enabled: false

traefik:
  enabled: false

# Other component configurations
vector:
  image:
    repository: cr-demo-cn-shanghai.cr.volces.com/cvat/vector
    tag: "0.26.0-alpine"

clickhouse:
  image:
    registry: cr-demo-cn-shanghai.cr.volces.com
    repository: cvat/clickhouse
    tag: "23.12.2-debian-11-r0"
  persistence:
    storageClass: "ebs-ssd"
    size: 10Gi
    accessModes:
      - ReadWriteOnce
    annotations: {}


grafana:
  image:
    repository: cr-demo-cn-shanghai.cr.volces.com/cvat/grafana
    tag: "10.1.5"

opa:
  image:
    repository: cr-demo-cn-shanghai.cr.volces.com/cvat/opa
    tag: "0.63.0"

kvrocks:
  image:
    repository: cr-demo-cn-shanghai.cr.volces.com/cvat/kvrocks
    tag: "2.7.0"
  persistence:
    storageClass: "ebs-ssd"
    size: 5Gi
    accessModes:
      - ReadWriteOnce
    annotations: {}


bats:
  image:
    repository: cr-demo-cn-shanghai.cr.volces.com/cvat/bats
    tag: "v1.4.1"